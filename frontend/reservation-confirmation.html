<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://api.fontshare.com/v2/css?f[]=outfit@100,300,400,500,600,700&display=swap" rel="stylesheet">
  <title>Reservation Confirmed | Phumelela Student Residence</title>
</head>
<body>
  <div id="header-placeholder"></div>

  <section class="confirm-section">
    <div class="confirm-rings">
      <svg viewBox="0 0 300 300" fill="none">
        <circle cx="150" cy="150" r="140" stroke="var(--primary)" stroke-width="8" />
        <circle cx="150" cy="150" r="110" stroke="var(--primary)" stroke-width="8" />
        <circle cx="150" cy="150" r="80" stroke="var(--primary)" stroke-width="8" />
      </svg>
    </div>

    <div class="confirm-card">
      <p class="confirm-title">Reservation Confirmed Successfully</p>

      <svg class="confirm-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4 13 9 18 20 6" />
      </svg>

      <p class="confirm-text">We'll email you within two business days with next steps.</p>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script type="module" src="./src/reservation-confirmation.js"></script>
</body>
</html>
