<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://api.fontshare.com/v2/css?f[]=outfit@100,300,400,500,600,700&display=swap" rel="stylesheet">
  <title>Contact Us | Phumelela Student Residence</title>
</head>
<body>
  <div id="header-placeholder"></div>

  <section class="page-hero">
    <div class="page-hero-bg"></div>
    <div class="page-hero-rings">
      <svg viewBox="0 0 400 400" fill="none">
        <circle cx="200" cy="200" r="180" stroke="var(--primary)" stroke-width="10" />
        <circle cx="200" cy="200" r="145" stroke="var(--primary)" stroke-width="10" />
        <circle cx="200" cy="200" r="110" stroke="var(--primary)" stroke-width="10" />
      </svg>
    </div>
    <h1 class="page-hero-title">Contact Us</h1>
  </section>

  <section class="touch">
    <div class="container touch-inner">
      <div class="touch-left">
        <h2 class="touch-heading">Get in Touch</h2>
        <p class="touch-text">
          We are here to answer your questions and explore new
          opportunities for collaboration.
        </p>

        <svg class="touch-icon" viewBox="0 0 64 64" fill="none">
          <path d="M6 20a8 8 0 0 1 8-8h14a8 8 0 0 1 8 8v6a8 8 0 0 1-8 8H18l-8 6v-6a8 8 0 0 1-4-8z" fill="#4C8DFF"/>
          <path d="M24 34a10 10 0 0 1 10-10h14a10 10 0 0 1 10 10v6a10 10 0 0 1-10 10H34l-10 7v-7a10 10 0 0 1 0-16z" fill="var(--primary)"/>
          <path d="M36 20a9 9 0 0 1 9-9h6a9 9 0 0 1 9 9v3a9 9 0 0 1-9 9h-3l-6 4v-4a9 9 0 0 1-6-12z" fill="#3DDC5B"/>
          <circle cx="40" cy="20" r="1.6" fill="#fff"/>
          <circle cx="45" cy="20" r="1.6" fill="#fff"/>
          <circle cx="50" cy="20" r="1.6" fill="#fff"/>
          <line x1="30" y1="38" x2="42" y2="38" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          <line x1="30" y1="43" x2="38" y2="43" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="touch-right">
        <img src="phumelela-logo.png" alt="Phumelela Student Housing" class="touch-logo" />

        <form class="contact-card" action="#" method="POST" novalidate>
          <div class="form-field">
            <input type="text" id="contact-name" name="name" placeholder="Name" aria-describedby="name-error" required />
            <span class="error-message" id="name-error" role="alert">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></svg>
              <span class="error-text"></span>
            </span>
          </div>

          <div class="form-field">
            <input type="email" id="contact-email" name="email" placeholder="Email" aria-describedby="contact-email-error" required />
            <span class="error-message" id="contact-email-error" role="alert">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></svg>
              <span class="error-text"></span>
            </span>
          </div>

          <div class="form-field">
            <input type="text" id="contact-subject" name="subject" placeholder="Subject" aria-describedby="subject-error" required />
            <span class="error-message" id="subject-error" role="alert">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></svg>
              <span class="error-text"></span>
            </span>
          </div>

          <div class="form-field">
            <textarea id="contact-message" name="message" placeholder="Message" aria-describedby="message-error" required></textarea>
            <span class="error-message" id="message-error" role="alert">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></svg>
              <span class="error-text"></span>
            </span>
          </div>

          <button type="submit" class="contact-submit">
            SEND
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12" />
              <polyline points="12 5 19 12 12 19" />
            </svg>
          </button>
        </form>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script type="module" src="./src/contact.js"></script>
  <script type="module" src="./src/scripts/contact-form.js"></script>
</body>
</html>
